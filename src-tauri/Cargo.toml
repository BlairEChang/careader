[package]
name = "careader"
version = "0.1.0"
description = "A local ebook reader (Tauri 2 + React)"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "careader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# M1：Android 移动端导入。dialog.open() 返回 content:// URI，无法用 std::fs 直接读，
# 经该插件的 ContentResolver（open_file_readable → std::fs::File）流式拷入书库。
# 桌面构建下该插件为空实现（open_file_readable 返回 Err），不影响桌面行为。
tauri-plugin-android-fs = "29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
encoding_rs = "0.8"
# M3：EPUB 解析（zip 解包 + quick-xml XML/HTML 流式解析）、MOBI 解析。
# zip 仅保留 deflate（EPUB 规范只要求 Store/Deflate），避免引入 zstd/lzma/xz 等重依赖。
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
mobi = "0.8"
